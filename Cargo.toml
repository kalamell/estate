[package]
name = "estate"
version = "0.1.0"
edition = "2021"
description = "ระบบบริหารจัดการอสังหาริมทรัพย์ให้เช่า: หอพัก อพาร์ทเมนต์ คอนโด และห้องพักรายวัน"

[dependencies]
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "ring", "hostname"] }
anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
thiserror = "1"
argon2 = "0.5"
axum-extra = { version = "0.9", features = ["cookie"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
base64 = "0.22"
urlencoding = "2"
aes-gcm = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rqrr = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
qrcode = { version = "0.14", default-features = false }
