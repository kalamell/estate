<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Estate — ระบบบริหารห้องเช่า</title>
    <meta name="description" content="Estate — ระบบบริหารหอพัก อพาร์ทเมนต์ คอนโด บ้านเช่า และห้องพักรายวัน" />
    <meta name="theme-color" content="#FAF9F6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // ตั้งธีมก่อน render เพื่อไม่ให้หน้าจอกะพริบ
      try {
        var t = localStorage.getItem('estate-theme')
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
        // ธีมสี: ค่าที่ผู้ใช้เลือก (ยกเว้นพอร์ทัลผู้เช่า) → ธีมองค์กรล่าสุด → ink
        var ids = ['ink', 'navy', 'terracotta', 'ocean', 'mono']
        var c = location.pathname.indexOf('/p/') === 0 ? null : localStorage.getItem('estate-color-theme')
        if (ids.indexOf(c) < 0) c = location.pathname.indexOf('/p/') === 0 ? 'ink' : localStorage.getItem('estate-org-theme')
        document.documentElement.setAttribute('data-theme', ids.indexOf(c) < 0 ? 'ink' : c)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
